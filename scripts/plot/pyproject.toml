[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-plot"
version = "0.1.0"
description = "Creating graphs to compare competitive structures in C++ and Rust."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
benchmark-plot = "benchmark_plot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]